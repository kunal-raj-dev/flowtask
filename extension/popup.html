<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FlowTask Quick Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #090B0F;
      color: #F8FAFC;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #F8FAFC;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #94A3B8;
      display: block;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      background: #14171F;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #F8FAFC;
      outline: none;
      margin-bottom: 10px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      border-color: #F59E0B;
    }
    textarea {
      height: 52px;
      resize: none;
    }
    .priority-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .priority-btn {
      flex: 1;
      padding: 5px 0;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      border-radius: 6px;
      background: #14171F;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94A3B8;
      cursor: pointer;
    }
    .priority-btn.active {
      background: #F59E0B;
      color: #000;
      border-color: #F59E0B;
    }
    .save-btn {
      width: 100%;
      background: #F59E0B;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .save-btn:hover {
      background: #FBBF24;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #10B981;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">⚡ FLOWTASK</span>
    <span class="title">Quick Capture</span>
  </div>

  <label for="task-title">Task Title</label>
  <input type="text" id="task-title" placeholder="What needs to be done?" autofocus />

  <label for="task-url">Reference URL / Notes</label>
  <textarea id="task-url" placeholder="Page link or context..."></textarea>

  <label>Priority</label>
  <div class="priority-row">
    <button type="button" class="priority-btn" data-p="p1">P1</button>
    <button type="button" class="priority-btn active" data-p="p2">P2</button>
    <button type="button" class="priority-btn" data-p="p3">P3</button>
    <button type="button" class="priority-btn" data-p="p4">P4</button>
  </div>

  <button type="button" class="save-btn" id="save-task">
    <span>Capture to Inbox</span>
  </button>

  <div class="status" id="status-msg">✓ Captured to FlowTask!</div>

  <script src="popup.js"></script>
</body>
</html>
